name: Build release artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-builds-main
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Prepare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' |
              node -e '
                const tags = require("fs").readFileSync(0, "utf8").trim().split(/\s+/)
                const versions = tags
                  .map((tag) => tag.match(/^v(\d+)\.(\d+)\.(\d+)$/))
                  .filter(Boolean)
                  .map((match) => match.slice(1).map(Number))
                const latest = versions.reduce(
                  (current, candidate) => {
                    if (!current) return candidate
                    const differingIndex = candidate.findIndex(
                      (part, index) => part !== current[index]
                    )
                    return differingIndex >= 0 && candidate[differingIndex] > current[differingIndex]
                      ? candidate
                      : current
                  },
                  null
                ) ?? [1, 0, 0]
                console.log(`${latest[0]}.${latest[1]}.${latest[2] + 1}`)
              '
          )"
          tag="v${version}"
          title="Camera Float ${tag}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          notes="$(mktemp)"
          cat > "$notes" <<EOF_NOTES
          Building release ${tag} from \`${SHA}\`.
          EOF_NOTES

          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$REPOSITORY" \
              --target "$SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --draft \
              --latest=false
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-x64
            os: macos-15-intel
            args: --mac --x64
          - name: mac-arm64
            os: macos-26
            args: --mac --arm64
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux AppImage deb --x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install Linux package prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: npm pkg set version="$RELEASE_VERSION"

      - name: Build application
        run: pnpm run build

      - name: Package Electron app
        shell: bash
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload packaged assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(dist/camera-*.AppImage dist/camera-*.deb dist/camera-*.dmg dist/camera-*.exe)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$REPOSITORY" \
            --clobber

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [prepare-release, build]

    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          assets="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets)"
          notes="$(mktemp)"

          ASSETS="$assets" node <<'NODE' > "$notes"
          const { assets } = JSON.parse(process.env.ASSETS)
          const repository = process.env.REPOSITORY
          const tag = process.env.RELEASE_TAG
          const version = process.env.RELEASE_VERSION
          const sha = process.env.SHA

          function assetLink(pattern, label) {
            const asset = assets.find(({ name }) => pattern.test(name))
            if (!asset) throw new Error(`Missing release asset matching ${pattern}`)
            const filename = encodeURIComponent(asset.name)
            return `[${label}](https://github.com/${repository}/releases/download/${tag}/${filename})`
          }

          console.log(`## Camera Float v${version}`)
          console.log('')
          console.log('| 平台 | 架构 | 下载 |')
          console.log('| --- | --- | --- |')
          console.log(`| macOS | Apple Silicon (arm64) | ${assetLink(/-mac-arm64\.dmg$/, 'DMG')} |`)
          console.log(`| macOS | Intel (x64) | ${assetLink(/-mac-x64\.dmg$/, 'DMG')} |`)
          console.log(`| Windows | x64 | ${assetLink(/-windows-x64-setup\.exe$/, 'Installer')} |`)
          console.log(`| Linux | x64 | ${assetLink(/-linux-x64\.AppImage$/, 'AppImage')} / ${assetLink(/-linux-x64\.deb$/, 'Deb')} |`)
          console.log('')
          console.log(`构建提交：[\`${sha.slice(0, 7)}\`](https://github.com/${repository}/commit/${sha})`)
          NODE

          gh release edit "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --title "Camera Float v${RELEASE_VERSION}" \
            --notes-file "$notes" \
            --draft=false \
            --latest
